name: Production Smoke

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mutation_smoke:
        description: "Run E2E_TEST mutation smoke without sending email"
        required: false
        default: "false"
      require_gmail_connected:
        description: "Fail if Gmail OAuth is not connected for the test account"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  health:
    name: Web, API, Readiness and Worker Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL || 'https://outreachaiaiai.com' }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      PRODUCTION_QUEUE_HEALTH_BEARER: ${{ secrets.PRODUCTION_QUEUE_HEALTH_BEARER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Run production health checks
        run: |
          set -o pipefail
          mkdir -p apps/web/test-artifacts
          npm --prefix apps/web run qa:production:health | tee apps/web/test-artifacts/production-health.json
      - name: Upload health logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-health
          path: apps/web/test-artifacts/production-health.json
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    name: Playwright Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: health
    env:
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL || 'https://outreachaiaiai.com' }}
      PRODUCTION_AUTH_STORAGE_STATE: ${{ secrets.PRODUCTION_AUTH_STORAGE_STATE }}
      PRODUCTION_E2E_EMAIL: ${{ secrets.PRODUCTION_E2E_EMAIL }}
      PRODUCTION_E2E_PASSWORD: ${{ secrets.PRODUCTION_E2E_PASSWORD }}
      PRODUCTION_SMOKE_MUTATION_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.mutation_smoke == 'true' && 'true' || vars.PRODUCTION_SMOKE_MUTATION_ENABLED }}
      PRODUCTION_REQUIRE_GMAIL_CONNECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.require_gmail_connected == 'true' && 'true' || vars.PRODUCTION_REQUIRE_GMAIL_CONNECTED }}
      E2E_TEST_PREFIX: E2E_TEST
      E2E_TEST_RUN_ID: E2E_TEST_${{ github.run_id }}_${{ github.run_attempt }}
      PRODUCTION_E2E_CLEANUP_URL: ${{ secrets.PRODUCTION_E2E_CLEANUP_URL }}
      PRODUCTION_E2E_CLEANUP_TOKEN: ${{ secrets.PRODUCTION_E2E_CLEANUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Materialize Playwright storage state
        if: env.PRODUCTION_AUTH_STORAGE_STATE != ''
        run: |
          mkdir -p apps/web/.auth
          printf '%s' "$PRODUCTION_AUTH_STORAGE_STATE" > apps/web/.auth/production-storage-state.json
          echo "PRODUCTION_AUTH_STORAGE_STATE=.auth/production-storage-state.json" >> "$GITHUB_ENV"
      - name: Install Playwright browsers
        run: cd apps/web && npm exec -- playwright install --with-deps chromium
      - name: Run production Playwright smoke
        run: npm --prefix apps/web run e2e:production
      - name: Cleanup E2E_TEST production records
        if: always()
        run: npm --prefix apps/web run qa:production:cleanup
      - name: Upload production Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-html-report
          path: apps/web/playwright-report-production
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload production traces, videos and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-test-results
          path: apps/web/test-results-production
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload production machine reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-machine-reports
          path: apps/web/test-artifacts
          if-no-files-found: ignore
          retention-days: 14

  issue-on-failure:
    name: Create Production Bug Issue
    runs-on: ubuntu-latest
    needs: [health, smoke]
    if: failure() && github.event_name == 'schedule'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Production smoke failure: ${new Date().toISOString().slice(0, 16)}Z`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "Confirmed by scheduled production smoke.",
              "",
              `Run: ${runUrl}`,
              "",
              "Evidence is limited to GitHub Actions artifacts: Playwright trace, screenshot, video, machine report, and sanitized health JSON.",
              "",
              "Maintenance rules:",
              "- Reproduce before fixing.",
              "- Use a separate branch.",
              "- Add a regression test.",
              "- Do not send real email, change live Stripe/Gmail credentials, change production secrets, delete real user data, deploy, merge to main, or change DB schema without explicit approval."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["production", "qa", "bug"]
            });
